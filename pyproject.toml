[project]
name = "autoparts-bot"
version = "0.1.0"
description = "Telegram bot for auto parts sales"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.13.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "asyncpg>=0.29.0",
  "aiosqlite>=0.20.0",
  "alembic>=1.13.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "python-dotenv>=1.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "jinja2>=3.1.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
